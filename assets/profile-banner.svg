<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Gupta</title>
  <desc id="desc">Full-stack developer with a backend focus. A teal and blue gradient animates across the banner.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152943"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5eead4"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8db5e8" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="220" rx="18"/></clipPath>
    <style>
      .glow { animation: drift 7s ease-in-out infinite alternate; }
      .signal { animation: pulse 3s ease-in-out infinite; transform-origin: 348px 60px; }
      @keyframes drift { from { transform: translateX(-100px); } to { transform: translateX(100px); } }
      @keyframes pulse { 50% { opacity: .45; transform: scale(.75); } }
      @media (prefers-reduced-motion: reduce) { .glow, .signal { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#background)"/>
    <rect width="900" height="220" fill="url(#grid)"/>
    <path class="glow" d="M-120 206C175 206 223 158 449 182S698 220 1020 170" fill="none" stroke="url(#accent)" stroke-opacity=".32" stroke-width="2"/>
    <rect y="216" width="900" height="4" fill="url(#accent)"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif">
    <circle class="signal" cx="348" cy="60" r="5" fill="#5eead4"/>
    <text x="459" y="65" fill="#a5f3fc" font-size="15" font-weight="600" letter-spacing="3">DEVELOPER PROFILE</text>
    <text x="450" y="124" fill="#f8fafc" font-size="54" font-weight="750">Ayush Gupta</text>
    <text x="450" y="160" fill="#cbd5e1" font-size="20">Full-stack developer with a backend focus</text>
  </g>
</svg>
